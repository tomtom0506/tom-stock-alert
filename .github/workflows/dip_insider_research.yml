# מחקר OFFLINE בלבד - הפעלה ידנית, אף פעם לא בקרון
name: Research - Dip buying & insider clusters (offline)

on:
  workflow_dispatch:
    inputs:
      part:
        description: "dip / insider / all"
        default: "all"
        required: true
      max_tickers:
        description: "0 = כל ~1,500 המניות; 150 = הרצת בדיקה"
        default: "150"
        required: true

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy yfinance requests lxml
      - name: Restore cache (SEC Form 4 quarters)
        uses: actions/cache@v4
        with:
          path: research/cache
          key: research-cache-dip-${{ github.run_id }}
          restore-keys: research-cache-dip-
      - name: Run research
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python research/dip_insider_research.py --part "${{ inputs.part }}" --max-tickers "${{ inputs.max_tickers }}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dip-insider-research-${{ github.run_number }}
          path: research/output/
