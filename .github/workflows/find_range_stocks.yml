name: Find Range-Bound Stocks

on:
  workflow_dispatch:  # manual trigger only - click "Run workflow" in the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run range-stock screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python find_range_stocks.py

      - name: Commit updated watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Add range-bound stock candidates to watchlist"
          # v5.30.2: several jobs push to main - retry with a fresh merge if another push won the race
          for i in 1 2 3 4 5; do
            git fetch origin main && git merge -X ours --no-edit origin/main && git push origin HEAD:main && exit 0
            echo "push rejected (attempt $i) - retrying"; sleep $((RANDOM % 15 + 5))
          done
          exit 1
