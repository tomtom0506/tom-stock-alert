name: Check Single Stock

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker to analyze (בדוק מניה)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: check-stock
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Analyze ticker
        env:
          CHECK_TICKER: ${{ inputs.ticker }}
        run: python check_stock.py "$CHECK_TICKER"

      - name: Commit result (if changed)
        env:
          CHECK_TICKER: ${{ inputs.ticker }}   # security: passed as data, never pasted into the shell script
        run: |
          [[ "$CHECK_TICKER" =~ ^[A-Za-z0-9.^=-]{1,15}$ ]] || CHECK_TICKER="invalid"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_check_result.json
          git diff --staged --quiet || git commit -m "בדוק מניה: ${CHECK_TICKER}"
          # v5.30.2: several jobs push to main - retry with a fresh merge if another push won the race
          for i in 1 2 3 4 5; do
            git fetch origin main && git merge -X ours --no-edit origin/main && git push origin HEAD:main && exit 0
            echo "push rejected (attempt $i) - retrying"; sleep $((RANDOM % 15 + 5))
          done
          exit 1
