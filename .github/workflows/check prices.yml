name: Check Stock Prices

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      refresh_news:
        description: "חפש מחדש חדשות לתנועות החריגות של הימים האחרונים"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          NEWS_REFRESH: ${{ inputs.refresh_news == 'true' && 'true' || 'false' }}   # only ever "true"/"false" reaches the script
        run: python stock_alerts.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json current_prices.json predictions.json
          if [ -d archive ]; then git add archive; fi   # v5.20.0: monthly history archives
          git diff --staged --quiet || git commit -m "Update alert state"
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git push origin HEAD:main
