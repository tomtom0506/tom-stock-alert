name: Check Stock Prices

on:
  schedule:
    - cron: "*/15 * * * *"
    # v5.20.1: GitHub skips most */15 runs on busy days, so the moments that
    # matter also get their own triggers (UTC). Each is a separate trigger,
    # so at least one usually fires on time:
    - cron: "20 0 * * 2-6"     # after midnight UTC: the daily price snapshot
    - cron: "0 13 * * 1-5"     # before the US open
    - cron: "20 20 * * 1-5"    # after the US close (summer time)
    - cron: "20 21 * * 1-5"    # after the US close (winter time, from 1.11)
  workflow_dispatch:
    inputs:
      refresh_news:
        description: "חפש מחדש חדשות לתנועות החריגות של הימים האחרונים"
        required: false
        default: "false"
      prices_only:
        description: "רק מחירים חיים (מהיר) - מופעל אוטומטית מהאפליקציה"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          NEWS_REFRESH: ${{ inputs.refresh_news == 'true' && 'true' || 'false' }}   # only ever "true"/"false" reaches the script
          PRICES_ONLY: ${{ inputs.prices_only == 'true' && 'true' || 'false' }}
        run: python stock_alerts.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json current_prices.json predictions.json
          if [ -f today.json ]; then git add today.json; fi   # v5.23.0: small file for the main screen
          if [ -d archive ]; then git add archive; fi   # v5.20.0: monthly history archives
          git diff --staged --quiet || git commit -m "Update alert state"
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git push origin HEAD:main
