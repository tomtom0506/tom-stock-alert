name: 🧪 מעבדת תיאוריות - שלב 3 (בדיקת חוסן)

# הפעלה ידנית בלבד. לא נוגע בשום קובץ של האפליקציה החיה -
# מוריד היסטוריה, בודק תיאוריות, ושומר את התוצאות כ-artifact להורדה.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run theory lab
        run: python research/theory_lab_stage3.py

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: theory-lab-stage3-results
          path: research/output_theory_lab_stage3/
          retention-days: 30
