# מחקר OFFLINE בלבד - הפעלה ידנית, אף פעם לא בקרון
name: Research - Winner fingerprint & catalysts (offline)

on:
  workflow_dispatch:
    inputs:
      part:
        description: "fingerprint / catalyst / all"
        default: "all"
        required: true
      max_tickers:
        description: "0 = כל היקום; מספר קטן = הרצת בדיקה מהירה"
        default: "0"
        required: true

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy yfinance requests lxml
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: research/cache
          key: research-cache-${{ github.run_id }}
          restore-keys: research-cache-
      - name: Run research
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python research/winner_catalyst_research.py --part "${{ inputs.part }}" --max-tickers "${{ inputs.max_tickers }}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winner-catalyst-research-${{ github.run_number }}
          path: research/output/
