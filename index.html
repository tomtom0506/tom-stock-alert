<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>המעקב שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --bg-glow: #0f1420;
    --panel: #141922;
    --panel-hi: #1a212c;
    --border: #232b38;
    --border-hi: #313c4d;
    --text: #e9ebef;
    --text-dim: #8e97a8;
    --text-faint: #5c6577;
    --gold: #d4a94a;
    --gold-dim: #a9863c;
    --gold-glow: rgba(212,169,74,0.16);
    --ice: #5fc9e8;
    --ice-dim: rgba(95,201,232,0.14);
    --up: #4fb286;
    --up-bg: rgba(79,178,134,0.12);
    --down: #d9695c;
    --down-bg: rgba(217,105,92,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text);
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(212,169,74,0.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(95,201,232,0.05), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, .display { font-family: 'Space Grotesk', sans-serif; }
  .serif { font-family: 'Fraunces', serif; font-optical-sizing: auto; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; direction: ltr; unicode-bidi: plaintext; }
  a { color: inherit; }
  button { font-family: inherit; }

  /* ---------- ticker tape ---------- */
  .tape-wrap {
    background: #10141b; border-bottom: 1px solid var(--border);
    overflow: hidden; white-space: nowrap; padding: 10px 0;
  }
  .tape-track {
    display: inline-flex; gap: 28px; animation: tape-scroll 30s linear infinite;
    padding-inline-start: 100%;
  }
  @keyframes tape-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tape-track { animation: none; }
  }
  .tape-item { display: inline-flex; align-items: baseline; gap: 6px; font-size: 13px; }
  .tape-ticker { font-weight: 600; color: var(--text); }
  .tape-price { color: var(--text-dim); }
  .tape-up { color: var(--up); }
  .tape-down { color: var(--down); }

  /* ---------- layout ---------- */
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }
  header.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .brand { font-size: 24px; font-weight: 600; letter-spacing: -0.2px; }
  .brand-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; letter-spacing: 0.3px; }
  .regime-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px; margin-bottom: 16px;
  }
  .regime-badge.bull { background: var(--up-bg); color: var(--up); }
  .regime-badge.bear { background: var(--down-bg); color: var(--down); }
  .gear-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 17px;
    display: flex; align-items: center; justify-content: center;
  }
  .gear-btn:active { background: var(--panel-hi); }

  /* ---------- hero stats ---------- */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat-tile {
    background: linear-gradient(180deg, var(--panel-hi) 0%, var(--panel) 30%);
    border: 1px solid var(--border); border-radius: 13px;
    padding: 13px 8px; text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.18);
  }
  .stat-num { font-size: 20px; font-weight: 700; color: var(--gold); }
  .stat-label { font-size: 10.5px; color: var(--text-faint); margin-top: 3px; line-height: 1.3; }

  /* ---------- section headers ---------- */
  .section-title {
    font-family: 'Fraunces', serif; font-optical-sizing: auto;
    font-size: 16px; font-weight: 600; color: var(--text); margin: 26px 0 12px;
    display: flex; align-items: center; gap: 7px;
  }

  /* ---------- predictions ---------- */
  .predictions-panel {
    border: 1px solid var(--border); background: linear-gradient(180deg, var(--panel-hi) 0%, var(--panel) 20%);
    border-radius: 16px; padding: 6px 15px; margin-bottom: 4px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.22);
  }
  .prediction-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px;
  }
  .prediction-row:last-child { border-bottom: none; }
  .prediction-ticker { font-weight: 700; }
  .prediction-dir-up { color: var(--up); }
  .prediction-dir-down { color: var(--down); }
  .prediction-row.strong { background: rgba(212,169,74,0.07); border-radius: 8px; padding: 10px 8px; margin: 3px 0; }
  .prediction-row.strong .prediction-ticker,
  .prediction-row.strong .prediction-dir-up,
  .prediction-row.strong .prediction-dir-down { font-weight: 800; }
  .predictions-empty { color: var(--text-faint); font-size: 13px; padding: 14px 0; text-align: center; }

  /* ---------- conviction gauge + factor badges ---------- */
  .conviction-bar {
    position: relative; height: 5px; border-radius: 3px; margin: 8px 0 10px;
    background: linear-gradient(to right, var(--down), #333c4a 48%, #333c4a 52%, var(--up));
  }
  .conviction-marker {
    position: absolute; top: -4px; width: 3px; height: 13px; background: #fff;
    border-radius: 2px; box-shadow: 0 0 6px rgba(255,255,255,0.5);
  }
  .factor-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .factor-badge {
    font-size: 10.5px; padding: 3px 8px; border-radius: 6px; font-weight: 600;
    background: rgba(255,255,255,0.05); color: var(--text-dim); border: 1px solid var(--border);
  }
  .factor-badge.pos { color: var(--up); border-color: rgba(79,178,134,0.3); background: var(--up-bg); }
  .factor-badge.neg { color: var(--down); border-color: rgba(217,105,92,0.3); background: var(--down-bg); }

  /* ---------- strong prediction track record ---------- */
  .track-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .track-tile {
    border-radius: 12px; padding: 12px 8px; text-align: center; border: 1px solid var(--border);
  }
  .track-tile.hits { background: var(--up-bg); }
  .track-tile.misses { background: var(--down-bg); }
  .track-tile.rate { background: rgba(212,169,74,0.1); }
  .track-num { font-size: 20px; font-weight: 700; }
  .track-tile.hits .track-num { color: var(--up); }
  .track-tile.misses .track-num { color: var(--down); }
  .track-tile.rate .track-num { color: var(--gold); }
  .track-label { font-size: 10.5px; color: var(--text-faint); margin-top: 3px; }
  .track-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .track-row:last-child { border-bottom: none; }
  .track-row .t-ticker { font-weight: 700; }
  .track-outcome { font-size: 12px; font-weight: 600; }
  .track-outcome.correct { color: var(--up); }
  .track-outcome.wrong { color: var(--down); }

  /* ---------- stock cards ---------- */
  .stock-card {
    background: linear-gradient(180deg, var(--panel-hi) 0%, var(--panel) 14%);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 15px 17px; margin-bottom: 11px; transition: border-color 0.15s;
    box-shadow: 0 4px 18px rgba(0,0,0,0.22);
    position: relative; overflow: hidden;
  }
  .stock-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,169,74,0.35), transparent);
  }
  .stock-card:active { border-color: var(--border-hi); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .card-id .card-ticker { font-size: 15px; font-weight: 700; }
  .card-id .card-name { font-size: 12px; color: var(--text-faint); margin-top: 1px; }
  .card-price-block { text-align: left; }
  .card-price { font-size: 19px; font-weight: 600; }
  .card-pct { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  .card-pct.up { color: var(--up); } .card-pct.down { color: var(--down); }
  .card-pct.flat { color: var(--text-faint); }

  .card-target-line {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; font-size: 12px; color: var(--text-dim);
  }
  .target-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600;
  }
  .target-badge.hit { background: var(--up-bg); color: var(--up); }
  .target-badge.pending { background: rgba(139,147,161,0.12); color: var(--text-dim); }
  .progress-track {
    flex: 1; height: 4px; background: #232a35; border-radius: 3px; margin: 0 10px; overflow: hidden; position: relative;
  }
  .progress-fill { height: 100%; border-radius: 3px; background: var(--gold); }
  .progress-marker {
    position: absolute; top: -3px; width: 2px; height: 10px; background: var(--text);
    border-radius: 2px;
  }

  .card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .icon-btn:active { background: var(--panel-hi); }
  .icon-btn.danger { color: var(--down); border-color: rgba(217,105,92,0.3); }

  /* ---------- edit mode ---------- */
  .edit-area { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); display: none; }
  .stock-card.editing .edit-area { display: block; }
  .stock-card.editing .card-view-only { opacity: 0.5; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  label.field-label { display: block; font-size: 10.5px; color: var(--text-faint); margin-bottom: 3px; }
  input.field-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border-hi); border-radius: 8px;
    padding: 8px 10px; font-size: 13.5px; color: var(--text);
  }
  input.field-input:focus { outline: none; border-color: var(--gold); }
  .range-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  .add-btn {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #24190a; border: none; border-radius: 28px;
    padding: 13px 26px; font-size: 14px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 24px rgba(212,169,74,0.35); z-index: 10;
  }
  .add-btn:active { transform: translateX(-50%) scale(0.97); }

  /* ---------- settings panel ---------- */
  .panel {
    border: 1px solid var(--border); background: var(--panel); border-radius: 14px;
    padding: 18px; margin-bottom: 16px;
  }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--text-dim); margin: 0 0 14px; }
  .panel input {
    width: 100%; background: var(--bg); border: 1px solid var(--border-hi); border-radius: 8px;
    padding: 9px 12px; font-size: 14px; color: var(--text); margin-bottom: 12px;
  }
  .panel input:focus { outline: none; border-color: var(--gold); }
  .btn-primary {
    width: 100%; background: var(--gold); color: #24190a; border: none;
    border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn-primary:disabled { opacity: 0.6; }

  .status { margin: 10px 0; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; }
  .status.ok { background: var(--up-bg); color: var(--up); }
  .status.error { background: var(--down-bg); color: var(--down); }
  .empty { text-align: center; color: var(--text-faint); font-size: 13.5px; padding: 34px 0; }
  .loading { text-align: center; color: var(--text-faint); font-size: 13.5px; padding: 34px 0; }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>

<div class="tape-wrap" id="tapeWrap" style="display:none;">
  <div class="tape-track mono" id="tapeTrack"></div>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand serif">המעקב שלי</div>
      <div class="brand-sub">מניות · תחזיות · התראות</div>
    </div>
    <button class="gear-btn" id="gearBtn" aria-label="הגדרות">⚙</button>
  </header>

  <div id="regimeBadge" class="regime-badge hidden"></div>

  <div class="stats-row hidden" id="statsRow">
    <div class="stat-tile"><div class="stat-num mono" id="statAccuracy">—</div><div class="stat-label">אחוז הצלחת חיזוי</div></div>
    <div class="stat-tile"><div class="stat-num mono" id="statPredictions">—</div><div class="stat-label">תחזיות חזקות היום</div></div>
    <div class="stat-tile"><div class="stat-num mono" id="statTracked">—</div><div class="stat-label">מניות במעקב</div></div>
    <div class="stat-tile"><div class="stat-num mono" id="statHit">—</div><div class="stat-label">הגיעו ליעד</div></div>
  </div>

  <div id="predictionsSection" class="hidden">
    <div class="section-title">🔮 תחזיות ליום המסחר הבא</div>
    <div class="predictions-panel"><div id="predictionsList"></div></div>
  </div>

  <div id="trackRecordSection" class="hidden">
    <div class="section-title">🔥 ביצועי תחזיות חזקות</div>
    <div class="track-stats">
      <div class="track-tile hits"><div class="track-num mono" id="trackHits">—</div><div class="track-label">הצלחות</div></div>
      <div class="track-tile misses"><div class="track-num mono" id="trackMisses">—</div><div class="track-label">כשלונות</div></div>
      <div class="track-tile rate"><div class="track-num mono" id="trackRate">—</div><div class="track-label">אחוז הצלחה</div></div>
    </div>
    <div class="predictions-panel"><div id="trackList"></div></div>
  </div>

  <div class="panel hidden" id="configPanel">
    <h2>חיבור ל-GitHub</h2>
    <label class="field-label">שם משתמש</label>
    <input id="cfgOwner" placeholder="tomtom0506" />
    <label class="field-label">שם הריפו</label>
    <input id="cfgRepo" placeholder="tom-stock-alert" />
    <label class="field-label">Personal Access Token (Contents: Read & Write)</label>
    <input id="cfgToken" type="password" placeholder="github_pat_..." />
    <button class="btn-primary" id="saveConfigBtn">שמור והתחבר</button>
  </div>

  <div class="loading hidden" id="loadingMsg">טוען...</div>

  <div id="watchlistSection" class="hidden">
    <div class="section-title">המניות שלי</div>
    <div id="rowsContainer"></div>
    <div class="empty hidden" id="emptyMsg">אין עדיין מניות. הוסף אחת עם הכפתור למטה.</div>
  </div>

  <div id="statusMsg"></div>
  <div class="empty hidden" id="needConfigMsg">הגדר חיבור ל-GitHub כדי להתחיל.</div>
</div>

<button class="add-btn hidden" id="addBtn">+ הוסף מניה</button>

<script>
const CONFIG_KEY = "gh-watchlist-config";
let owner = "", repo = "", token = "", sha = null, rows = [];
let latestPredictionsByTicker = {};
let currentPrices = {};
let editingId = null;

/* ---------- storage / config ---------- */
function loadConfig() {
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveConfigToStorage(cfg) {
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); } catch (e) {}
}

/* ---------- encoding helpers ---------- */
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach((b) => (binary += String.fromCharCode(b)));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64.replace(/\n/g, ""));
  const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function setStatus(type, text) {
  const el = document.getElementById("statusMsg");
  el.innerHTML = text ? `<div class="status ${type}">${text}</div>` : "";
}
function showConfigPanel(show) {
  document.getElementById("configPanel").classList.toggle("hidden", !show);
}

/* ---------- data loads ---------- */
async function loadCurrentPrices() {
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/current_prices.json?t=${Date.now()}`);
    if (!res.ok) return;
    const data = await res.json();
    currentPrices = data.prices || {};
  } catch (e) {
    currentPrices = {};
  }
}

function renderRegimeBadge(marketRegime) {
  const badge = document.getElementById("regimeBadge");
  if (!marketRegime || marketRegime.bullish == null) {
    badge.classList.add("hidden");
    return;
  }
  const bull = marketRegime.bullish;
  badge.className = "regime-badge " + (bull ? "bull" : "bear");
  const pct = marketRegime.recent_10d_pct;
  const pctText = pct != null ? ` (${pct >= 0 ? "+" : ""}${pct}% ב-10 ימים)` : "";
  badge.innerHTML = bull
    ? `📈 מצב שוק כללי: שורי${pctText}`
    : `📉 מצב שוק כללי: דובי${pctText}`;
  badge.classList.remove("hidden");
}

function convictionBarHtml(score) {
  const clamped = Math.max(-5, Math.min(5, score));
  const pct = ((clamped + 5) / 10) * 100;
  return `<div class="conviction-bar"><div class="conviction-marker" style="right:${pct}%"></div></div>`;
}

function factorBadgesHtml(p) {
  const badges = [];
  if (p.rsi != null) {
    if (p.rsi <= 30) badges.push(`<span class="factor-badge pos">RSI ${p.rsi.toFixed(0)} · תשואת יתר</span>`);
    else if (p.rsi >= 70) badges.push(`<span class="factor-badge neg">RSI ${p.rsi.toFixed(0)} · קניית יתר</span>`);
    else badges.push(`<span class="factor-badge">RSI ${p.rsi.toFixed(0)}</span>`);
  }
  if (p.macd_bullish != null) {
    badges.push(p.macd_bullish
      ? `<span class="factor-badge pos">MACD חיובי</span>`
      : `<span class="factor-badge neg">MACD שלילי</span>`);
  }
  if (p.ma_trend === "golden") badges.push(`<span class="factor-badge pos">מגמת זהב 🌟</span>`);
  else if (p.ma_trend === "death") badges.push(`<span class="factor-badge neg">מגמה שלילית 💀</span>`);
  if (p.vol_ratio != null && p.vol_ratio >= 1.5) {
    badges.push(`<span class="factor-badge">📊 נפח חריג x${p.vol_ratio.toFixed(1)}</span>`);
  }
  if (p.upside_pct != null && p.upside_pct >= 15) {
    badges.push(`<span class="factor-badge pos">אנליסטים: +${p.upside_pct.toFixed(0)}%</span>`);
  }
  if (p.short_pct != null && p.short_pct >= 8) {
    badges.push(`<span class="factor-badge">שורט ${p.short_pct.toFixed(0)}%</span>`);
  }
  return badges.length ? `<div class="factor-badges">${badges.join("")}</div>` : "";
}

async function loadPredictions() {
  const section = document.getElementById("predictionsSection");
  const list = document.getElementById("predictionsList");
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/predictions.json?t=${Date.now()}`);
    if (!res.ok) { section.classList.add("hidden"); return; }
    const data = await res.json();
    const history = data.history || [];
    const acc = data.accuracy || {};

    renderRegimeBadge(data.market_regime);

    document.getElementById("statsRow").classList.remove("hidden");
    document.getElementById("statAccuracy").textContent = acc.overall != null ? `${acc.overall}%` : "—";

    const today = new Date().toISOString().slice(0, 10);
    const preds = history.filter(p => p.date === today && Math.abs(p.score) >= 1.5);
    preds.sort((a, b) => Math.abs(b.score) - Math.abs(a.score));
    document.getElementById("statPredictions").textContent = preds.length;

    latestPredictionsByTicker = {};
    history.filter(p => p.date === today).forEach(p => { latestPredictionsByTicker[p.ticker] = p; });
    if (rows.length) render(); // refresh watchlist cards with fresh prediction badges

    if (preds.length === 0) {
      list.innerHTML = `<div class="predictions-empty">אין חיזויים חזקים כרגע</div>`;
    } else {
      list.innerHTML = preds.map(p => `
        <div class="prediction-row ${p.strong ? "strong" : ""}" style="flex-direction:column;align-items:stretch;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="prediction-ticker mono">${p.ticker}${p.strong ? " 🔥" : ""}</span>
            <span class="${p.predicted === "up" ? "prediction-dir-up" : "prediction-dir-down"}">
              ${p.predicted === "up" ? "▲ עלייה" : "▼ ירידה"} · ${p.score}
            </span>
          </div>
          ${convictionBarHtml(p.score)}
          ${factorBadgesHtml(p)}
        </div>
      `).join("");
    }
    section.classList.remove("hidden");
    renderTrackRecord(history, acc);
  } catch (e) {
    section.classList.add("hidden");
  }
}

function renderTrackRecord(history, acc) {
  const section = document.getElementById("trackRecordSection");
  const list = document.getElementById("trackList");

  if (!acc || !acc.strong_total) {
    section.classList.add("hidden");
    return;
  }

  document.getElementById("trackHits").textContent = acc.strong_hits ?? 0;
  document.getElementById("trackMisses").textContent = acc.strong_misses ?? 0;
  document.getElementById("trackRate").textContent = acc.strong_only != null ? `${acc.strong_only}%` : "—";

  const gradedStrong = history
    .filter(p => p.strong && p.graded)
    .sort((a, b) => (a.date < b.date ? 1 : -1))
    .slice(0, 10);

  if (gradedStrong.length === 0) {
    list.innerHTML = `<div class="predictions-empty">עדיין אין תחזיות חזקות שנבדקו</div>`;
  } else {
    list.innerHTML = gradedStrong.map(p => `
      <div class="track-row">
        <span class="t-ticker mono">${p.ticker}</span>
        <span class="mono" style="color:var(--text-faint)">${p.date}</span>
        <span>${p.predicted === "up" ? "▲" : "▼"} ${p.score}</span>
        <span class="track-outcome ${p.correct ? "correct" : "wrong"}">${p.correct ? "✅ הצליח" : "❌ פספס"}</span>
      </div>
    `).join("");
  }
  section.classList.remove("hidden");
}

function renderTickerTape() {
  const wrap = document.getElementById("tapeWrap");
  const track = document.getElementById("tapeTrack");
  const items = rows.filter(r => currentPrices[(r.ticker || "").trim()]);
  if (items.length === 0) { wrap.style.display = "none"; return; }
  const build = () => items.map(r => {
    const info = currentPrices[r.ticker.trim()];
    const pct = info.pct_change;
    const cls = pct == null ? "" : (pct >= 0 ? "tape-up" : "tape-down");
    const arrow = pct == null ? "" : (pct >= 0 ? "▲" : "▼");
    return `<span class="tape-item"><span class="tape-ticker">${r.ticker}</span>
      <span class="tape-price">${info.price.toFixed(2)}</span>
      <span class="${cls}">${arrow} ${pct != null ? Math.abs(pct).toFixed(1) + "%" : ""}</span></span>`;
  }).join("");
  track.innerHTML = build() + build(); // duplicate for seamless loop
  wrap.style.display = "block";
}

function updateHitStats() {
  let hit = 0;
  rows.forEach(r => {
    const info = currentPrices[(r.ticker || "").trim()];
    if (!info) return;
    const hitHigh = r.target_high && info.price >= r.target_high;
    const hitLow = r.target_low && info.price <= r.target_low;
    if (hitHigh || hitLow) hit++;
  });
  document.getElementById("statTracked").textContent = rows.length;
  document.getElementById("statHit").textContent = hit;
  document.getElementById("statsRow").classList.remove("hidden");
}

/* ---------- watchlist load/save ---------- */
async function loadWatchlist() {
  document.getElementById("loadingMsg").classList.remove("hidden");
  document.getElementById("watchlistSection").classList.add("hidden");
  document.getElementById("addBtn").classList.add("hidden");
  setStatus(null, "");
  try {
    const res = await fetch(
      `https://api.github.com/repos/${owner}/${repo}/contents/watchlist.json`,
      { headers: { Authorization: `token ${token}`, Accept: "application/vnd.github.v3+json" } }
    );
    if (!res.ok) throw new Error(`שגיאה בטעינה (${res.status}). בדוק שם משתמש, ריפו וטוקן.`);
    const data = await res.json();
    rows = JSON.parse(base64ToUtf8(data.content));
    sha = data.sha;
    await loadCurrentPrices();
    renderTickerTape();
    updateHitStats();
    render();
    document.getElementById("watchlistSection").classList.remove("hidden");
    document.getElementById("addBtn").classList.remove("hidden");
  } catch (e) {
    setStatus("error", e.message || "שגיאה בטעינת הרשימה");
  } finally {
    document.getElementById("loadingMsg").classList.add("hidden");
  }
}

async function saveWatchlist() {
  const addBtn = document.getElementById("addBtn");
  addBtn.disabled = true;
  setStatus(null, "");
  try {
    const clean = rows.map(r => ({
      ticker: (r.ticker || "").trim(),
      name: (r.name || "").trim() || (r.ticker || "").trim(),
      target_high: Number(r.target_high) || null,
      target_low: Number(r.target_low) || null,
    }));
    const body = {
      message: "עדכון רשימת מניות דרך הממשק",
      content: utf8ToBase64(JSON.stringify(clean, null, 2)),
      sha,
    };
    const res = await fetch(
      `https://api.github.com/repos/${owner}/${repo}/contents/watchlist.json`,
      {
        method: "PUT",
        headers: {
          Authorization: `token ${token}`,
          Accept: "application/vnd.github.v3+json",
          "Content-Type": "application/json",
        },
        body: JSON.stringify(body),
      }
    );
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody.message || `שמירה נכשלה (${res.status})`);
    }
    const data = await res.json();
    sha = data.content.sha;
    setStatus("ok", "נשמר בהצלחה ✓");
  } catch (e) {
    setStatus("error", e.message || "שמירה נכשלה");
  } finally {
    addBtn.disabled = false;
  }
}

/* ---------- rendering: view + inline edit ---------- */
function renderCurrentPriceLine(ticker) {
  const info = currentPrices[(ticker || "").trim()];
  if (!info || info.price == null) return { price: null, pct: null };
  return { price: info.price, pct: info.pct_change };
}

function render() {
  const container = document.getElementById("rowsContainer");
  container.innerHTML = "";
  document.getElementById("emptyMsg").classList.toggle("hidden", rows.length !== 0);

  rows.forEach((row, idx) => {
    const { price, pct } = renderCurrentPriceLine(row.ticker);
    const pctClass = pct == null ? "flat" : (pct >= 0 ? "up" : "down");
    const pctText = pct == null ? "—" : `${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%`;

    const high = Number(row.target_high) || null;
    const low = Number(row.target_low) || null;
    const hitHigh = price != null && high && price >= high;
    const hitLow = price != null && low && price <= low;
    const hit = hitHigh || hitLow;

    let targetLineHtml;
    if (high && low) {
      // full range: marker shows where current price sits between low and high
      let markerPct = 50;
      if (price != null && high > low) {
        markerPct = Math.min(100, Math.max(0, ((price - low) / (high - low)) * 100));
      }
      let badgeText = "בטווח";
      if (hitHigh) badgeText = "✓ מעל היעד העליון";
      else if (hitLow) badgeText = "✓ מתחת ליעד התחתון";
      targetLineHtml = `
        <div class="card-target-line">
          <span class="target-badge ${hit ? "hit" : "pending"}">${badgeText}</span>
        </div>
        <div class="card-target-line">
          <span class="mono">${low}</span>
          <div class="progress-track"><div class="progress-marker" style="right:${markerPct}%"></div></div>
          <span class="mono">${high}</span>
        </div>`;
    } else if (high || low) {
      const target = high || low;
      const isAbove = !!high;
      let progressPct = 0;
      if (price != null && target > 0) {
        progressPct = isAbove
          ? Math.min(100, Math.max(0, (price / target) * 100))
          : Math.min(100, Math.max(0, (target / Math.max(price, 0.01)) * 100));
      }
      targetLineHtml = `
        <div class="card-target-line">
          <span class="target-badge ${hit ? "hit" : "pending"}">${hit ? "✓ הגיע ליעד" : (isAbove ? "יעד: מעל" : "יעד: מתחת")}</span>
          <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
          <span class="mono">${target}</span>
        </div>`;
    } else {
      targetLineHtml = `
        <div class="card-target-line">
          <span class="target-badge pending">לא הוגדר טווח</span>
        </div>`;
    }

    const isEditing = editingId === row._uid;
    const div = document.createElement("div");
    div.className = "stock-card" + (isEditing ? " editing" : "");
    div.innerHTML = `
      <div class="card-view-only">
        <div class="card-top">
          <div class="card-id">
            <div class="card-ticker mono">${row.ticker || "?"}</div>
            <div class="card-name">${row.name || ""}</div>
          </div>
          <div class="card-price-block">
            <div class="card-price mono">${price != null ? price.toFixed(2) : "—"}</div>
            <div class="card-pct mono ${pctClass}">${pctText}</div>
          </div>
        </div>
        ${targetLineHtml}
        ${(() => {
          const pred = latestPredictionsByTicker[(row.ticker || "").trim()];
          if (!pred) return "";
          const dirText = pred.predicted === "up" ? "▲ עלייה" : "▼ ירידה";
          const dirClass = pred.predicted === "up" ? "prediction-dir-up" : "prediction-dir-down";
          return `
            <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);">
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-dim);">
                <span>🔮 חיזוי היום</span>
                <span class="${dirClass}">${dirText} · ${pred.score}${pred.strong ? " 🔥" : ""}</span>
              </div>
              ${convictionBarHtml(pred.score)}
              ${factorBadgesHtml(pred)}
            </div>`;
        })()}
      </div>
      <div class="card-actions">
        <button class="icon-btn" data-action="toggle-edit" data-idx="${idx}">${isEditing ? "סגור" : "✏ ערוך"}</button>
        <button class="icon-btn danger" data-action="delete" data-idx="${idx}">🗑 מחק</button>
      </div>
      <div class="edit-area">
        <div class="field-row">
          <div>
            <label class="field-label">טיקר (Yahoo Finance)</label>
            <input class="field-input mono" data-idx="${idx}" data-field="ticker" value="${row.ticker || ""}" placeholder="AAPL / TEVA.TA" />
          </div>
          <div>
            <label class="field-label">שם לתצוגה</label>
            <input class="field-input" data-idx="${idx}" data-field="name" value="${row.name || ""}" placeholder="Apple" />
          </div>
        </div>
        <div class="field-row">
          <div>
            <label class="field-label">יעד עליון (התראה כשעולה מעל)</label>
            <input class="field-input mono" type="number" data-idx="${idx}" data-field="target_high" value="${row.target_high ?? ""}" placeholder="למשל 60" />
          </div>
          <div>
            <label class="field-label">יעד תחתון (התראה כשיורד מתחת)</label>
            <input class="field-input mono" type="number" data-idx="${idx}" data-field="target_low" value="${row.target_low ?? ""}" placeholder="למשל 40" />
          </div>
        </div>
        <div class="range-labels">אפשר למלא רק אחד מהשניים, או את שניהם לטווח מלא</div>
        <button class="btn-primary" data-action="save-all" style="margin-top:10px">💾 שמור שינויים</button>
      </div>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll("input[data-field]").forEach((input) => {
    input.addEventListener("input", (e) => {
      const i = +e.target.dataset.idx;
      rows[i][e.target.dataset.field] = e.target.value;
    });
  });
  container.querySelectorAll("button[data-action='toggle-edit']").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      const i = +e.target.dataset.idx;
      editingId = editingId === rows[i]._uid ? null : rows[i]._uid;
      render();
    });
  });
  container.querySelectorAll("button[data-action='delete']").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      const i = +e.target.dataset.idx;
      rows.splice(i, 1);
      render();
      saveWatchlist();
    });
  });
  container.querySelectorAll("button[data-action='save-all']").forEach((btn) => {
    btn.addEventListener("click", () => {
      editingId = null;
      render();
      saveWatchlist();
    });

  });
}

/* ---------- top-level controls ---------- */
document.getElementById("gearBtn").addEventListener("click", () => {
  showConfigPanel(document.getElementById("configPanel").classList.contains("hidden"));
});

document.getElementById("saveConfigBtn").addEventListener("click", () => {
  owner = document.getElementById("cfgOwner").value.trim();
  repo = document.getElementById("cfgRepo").value.trim();
  token = document.getElementById("cfgToken").value.trim();
  saveConfigToStorage({ owner, repo, token });
  showConfigPanel(false);
  document.getElementById("needConfigMsg").classList.add("hidden");
  loadWatchlist().then(() => { ensureUids(); render(); });
  loadPredictions();
});

document.getElementById("addBtn").addEventListener("click", () => {
  const uid = "new-" + Date.now();
  rows.unshift({ ticker: "", name: "", target_high: null, target_low: null, _uid: uid });
  editingId = uid;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* assign stable uid to rows without one (loaded from server) */
function ensureUids() {
  rows.forEach(r => { if (!r._uid) r._uid = r.ticker + "-" + Math.random().toString(36).slice(2); });
}

/* ---------- init ---------- */
const cfg = loadConfig();
if (cfg && cfg.owner && cfg.repo && cfg.token) {
  owner = cfg.owner; repo = cfg.repo; token = cfg.token;
  document.getElementById("cfgOwner").value = owner;
  document.getElementById("cfgRepo").value = repo;
  document.getElementById("cfgToken").value = token;
  loadWatchlist().then(() => { ensureUids(); render(); });
  loadPredictions();
} else {
  showConfigPanel(true);
  document.getElementById("needConfigMsg").classList.remove("hidden");
}
</script>
</body>
</html>
